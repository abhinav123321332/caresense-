[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "caresense"
version = "0.1.0"
description = "Frozen CareSense inference and API distribution"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.6", "xgboost>=3.0", "shap>=0.48", "joblib>=1.4", "fastapi>=0.115", "uvicorn>=0.30"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
